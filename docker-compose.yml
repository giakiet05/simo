services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: simo-server
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: simo-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:80"
    depends_on:
      - server
