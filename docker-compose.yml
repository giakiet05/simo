services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres-o0no0vysbjfx3sx5e1rple6m:5432/simo?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-simo_jwt_secret_key_production_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://simo.giakiet.io.vn,http://localhost:3000}
    expose:
      - "8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://simo-api.giakiet.io.vn/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
